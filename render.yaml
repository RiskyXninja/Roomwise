services:
  - type: web
    name: roomwise
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:cloud
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
